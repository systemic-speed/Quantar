[package]
name = "quantar-kernels"
version = "1.2.0"
edition = "2021"
description = "High-performance Rust kernels for Quantar quantum simulations."

[lib]
name = "quantar_kernels"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312 targets CPython's stable ABI. One compiled extension works on
# Python 3.12+ (including 3.14 and 3.15) instead of needing a separate
# cp312/cp313/cp314/cp315 build for every minor version.
pyo3 = { version = "0.30", features = ["extension-module", "multiple-pymethods", "abi3-py312"] }
numpy = "0.30"
num-complex = "0.4"
rayon = "1.10"
rand = "0.10.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
