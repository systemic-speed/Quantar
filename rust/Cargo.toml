[package]
name = "quantar-kernels"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust kernels for Quantar quantum simulations."

[lib]
name = "_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
num-complex = "0.4"
rayon = "1.10"
rand = "0.10.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
