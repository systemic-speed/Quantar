[build-system]
requires = ["hatchling", "pegen>=0.3.0", "hatch-maturin-build", "maturin>=1.7,<2.0"]
build-backend = "hatchling.build"

[project]
name = "Quantar"
description = "A Python superset for easy quantum computing, operator creation and physics simulations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["quantum", "quantum-computing", "physics", "programming-language", "rust"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "numba",
    "openqasm3[parser]",
    "pegen>=0.3.0",
    "pyinstaller",
    "typer>=0.29.3",
    "rich"
]

[project.urls]
Homepage = "https://github.com/systemic-speed/Quantar"
Repository = "https://github.com/systemic-speed/Quantar"
Issues = "https://github.com/systemic-speed/Quantar/issues"

[project.optional-dependencies]
backends = [
    "pennylane",
    "qiskit",
    "qbraid",
    "qiskit-aer",
]
optimization = ["scipy"]
lsp = ["pygls>=2.1,<3", "lsprotocol"]

[tool.hatch.version]
path = "src/lang_systems/__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantar", "src/quantum", "src/stl", "src/lang_systems"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/roadmap.md",
    "/docs/API.md",
    "/LICENSE",
    "/pyproject.toml",
    "/hatch_build.py",
    "/rust",
    "/src/quantar",
    "/src/quantum",
    "/src/stl",
    "/src/lang_systems",
    "/Grammar/python.gram",
    "/Grammar/python_clean.gram",
]

exclude = [
    "/rust/target",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "quantum.quantar_kernels"
profile = "release"
editable-profile = "dev"
rustc-args = ["-Awarnings"]

[project.scripts]
qtr = "lang_systems.runner:main"
quantar-lsp = "lang_systems.lsp.server:main"

[tool.hatch.build.targets.wheel.hooks.maturin]
manifest-path = "rust/Cargo.toml"
# Keep normal builds quiet. Use `HATCH_MATURIN_ARGS="-vv"` (or
# `QUANTAR_VERBOSE_BUILD=1`) when you want cargo/maturin detail.
args = []
